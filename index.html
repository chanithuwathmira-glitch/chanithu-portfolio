/* ===== style.css — ඔක්කොම මෙතන. පාට වෙනස් කරන්න නම් :root එකේ බලන්න ===== */
/* =========================================================
   CHANITHU LIYANAGE — DIGITAL CV & PORTFOLIO
   Plain CSS. No framework.

   HOW THIS FILE IS ORGANISED
   1.  Colours & settings (change colours HERE)
   2.  Basic reset
   3.  Shared pieces (buttons, badges, icons, cards)
   4.  Header & navigation
   5.  Hero (top section)
   6.  About
   7.  Education
   8.  Leadership
   9.  Skills
   10. Projects
   11. Contact
   12. Footer
   13. CV pop-up
   14. Small helpers
   ========================================================= */


/* =========================================================
   1. COLOURS & SETTINGS
   Change a colour here and it changes everywhere.
   ========================================================= */
:root {
  --bg:       #071A47;   /* main page background (dark navy)   */
  --navy:     #0A2463;   /* slightly lighter navy              */
  --alt-bg:   #081E52;   /* background of every second section */
  --blue:     #4DA6FF;   /* main accent colour                 */
  --blue-2:   #7EC0FF;   /* lighter accent                     */
  --ink:      #FFFFFF;   /* main text colour                   */
  --muted:    #C6D7F5;   /* softer text colour                 */
  --muted-2:  #8EA9D6;   /* smallest labels                    */
  --line:     rgba(255, 255, 255, .14);   /* thin border lines */
  --card:     #0D2E77;   /* card background                    */
  --card-hover: #123A8A; /* card background when hovered       */
  --green:    #6EE7B7;   /* "LIVE" / "copied" green            */

  color-scheme: dark;
}


/* =========================================================
   2. BASIC RESET
   ========================================================= */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;           /* smooth scrolling for menu links */
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Manrope', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.5;
  overflow-x: clip;                  /* stops sideways scrolling on phones */
}

/* Headings use the second font */
h1, h2, h3, h4 {
  margin: 0;
  font-family: 'Space Grotesk', 'Manrope', system-ui, sans-serif;
  letter-spacing: -.02em;
}

p, dl, dd { margin: 0; }

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
textarea {
  font: inherit;
  color: inherit;
}

button { cursor: pointer; }

svg { display: block; }

/* The "hidden" attribute must always win (used by script.js) */
[hidden] { display: none !important; }

/* Highlighted text colour */
::selection {
  background: var(--blue);
  color: #071A47;
}

/* Keyboard focus ring (accessibility) */
a:focus-visible,
button:focus-visible {
  outline: 2px solid var(--blue-2);
  outline-offset: 3px;
}

/* Jump-to-section links stop below the sticky header */
section[id] { scroll-margin-top: 5rem; }

/* Centred page width used by every section */
.container {
  max-width: 80rem;                  /* 1280px */
  margin: 0 auto;
  padding-left: 1rem;
  padding-right: 1rem;
}
@media (min-width: 640px)  { .container { padding-left: 1.5rem; padding-right: 1.5rem; } }
@media (min-width: 1024px) { .container { padding-left: 2rem;   padding-right: 2rem;   } }

   3. SHARED PIECES
   ========================================================= */

/* ---- Icons ---- */

  width: 18px;
  height: 18px;
  flex-shrink: 0;
  fill: none;
  stroke: currentColor;
